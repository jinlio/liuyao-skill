[project]
name = "liuyao-skill"
version = "0.1.1"
description = "六爻占卜与解卦 Claude Code skill — 基于周易原理，支持铜钱法、蓍草法和手动起卦"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["divination", "i-ching", "zhouyi", "hexagram", "liuyao", "claude-code-skill"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/jinlio/liuyao-skill"

[project.scripts]
liuyao-qigua = "scripts.qigua:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.hatch.build.targets.wheel]
packages = ["scripts", "assets", "references"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
